# Conda environment for running the scripts_frs pipeline on the Glados cluster
# (glados.ucalgary.ca). Lean counterpart of environment.yml: no notebook or
# picking/ extras, and no conda compilers -- CUDA 11.2's nvcc only accepts host
# gcc <= 10, so pyscamp is compiled with the cluster's own gcc module instead
# (see scripts_frs/glados/build_pyscamp.slurm, which also installs pyscamp;
# it is deliberately absent from the pip list below so that a plain
# `conda env create` never produces a CPU-only build by accident).
name: seismo-pyscamp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - cmake>=3.18          # SCAMP's build needs >= 3.18; the module system only has 3.10
  - git
  # core seiscamp package
  - numpy
  - scipy
  - pandas
  - matplotlib
  - statsmodels
  - obspy
  # scripts_frs step4
  - networkx
  - eqcorrscan
  # pinned for the same h5py/HDF5 mismatch as environment.yml
  - hdf5=2.1
  - pip:
      - -e .
